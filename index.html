<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube Mp3 Downloader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
         <img src="youtube-logo.svg" alt="Youtube Logo">
         <h1>Youtube Search</h1>
        </div>

        <form id="search-form">
            <input type="text" id="search-input" placeholder="Search">
            <button type="submit">Search</button>
        </form>

    </header>

    <div id="video-list">

    </div>

    <div id="video-model" class="model">
        <div class="model-content">
            <span class="close-model">&times;</span>
            <iframe id="video-player" frameborder="0" allowfullscreen></iframe>
            <button id="download-as-mp3">Download as MP3</button>
        </div>
    </div>

    
    <script src="script.js">

    </script>
</body>
</html>
